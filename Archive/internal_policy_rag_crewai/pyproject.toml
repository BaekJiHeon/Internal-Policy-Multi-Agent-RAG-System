[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-policy-rag-crewai"
version = "0.1.0"
description = "교육용 사내 규정 RAG 멀티에이전트 시스템"
requires-python = ">=3.11"
dependencies = [
  "crewai[openai]>=1.15,<2.0",
  "python-dotenv>=1.0",
  "pydantic>=2.10,<3.0",
  "pdfplumber>=0.11,<1.0",
  "pyhwp==0.1b15",
  "chromadb>=1.0,<2.0",
  "rich>=13.0,<15.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbformat>=5.10", "pandas>=2.0"]
test = ["pytest>=8.0"]

[project.scripts]
policy-rag = "internal_policy_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
